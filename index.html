<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnipVault</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <span class="logo-icon">⌗</span>
        <span class="logo-text">SnipVault</span>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-filter="all">
          <span class="nav-icon">◈</span>
          <span>All snippets</span>
          <span class="nav-count" id="count-all">0</span>
        </button>
        <button class="nav-item" data-filter="typescript">
          <span class="nav-icon lang-dot ts"></span>
          <span>TypeScript</span>
          <span class="nav-count" id="count-typescript">0</span>
        </button>
        <button class="nav-item" data-filter="javascript">
          <span class="nav-icon lang-dot js"></span>
          <span>JavaScript</span>
          <span class="nav-count" id="count-javascript">0</span>
        </button>
        <button class="nav-item" data-filter="css">
          <span class="nav-icon lang-dot css"></span>
          <span>CSS</span>
          <span class="nav-count" id="count-css">0</span>
        </button>
        <button class="nav-item" data-filter="html">
          <span class="nav-icon lang-dot html"></span>
          <span>HTML</span>
          <span class="nav-count" id="count-html">0</span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <button class="new-btn" id="open-modal-btn">
          <span>+ New snippet</span>
        </button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <header class="topbar">
        <button class="hamburger" id="hamburger" aria-label="Toggle menu">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
        <div class="search-wrap">
          <svg
            class="search-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
          <input
            class="search-input"
            id="search"
            type="text"
            placeholder="Search snippets..."
            autocomplete="off"
          />
          <kbd class="search-kbd">⌘K</kbd>
        </div>
        <div class="topbar-right">
          <span class="topbar-label" id="result-label">0 snippets</span>
          <button class="view-toggle" id="view-toggle" title="Toggle view">
            <svg
              id="icon-grid"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="7" height="7" />
              <rect x="14" y="3" width="7" height="7" />
              <rect x="14" y="14" width="7" height="7" />
              <rect x="3" y="14" width="7" height="7" />
            </svg>
            <svg
              id="icon-list"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              style="display: none"
            >
              <line x1="8" y1="6" x2="21" y2="6" />
              <line x1="8" y1="12" x2="21" y2="12" />
              <line x1="8" y1="18" x2="21" y2="18" />
              <line x1="3" y1="6" x2="3.01" y2="6" />
              <line x1="3" y1="12" x2="3.01" y2="12" />
              <line x1="3" y1="18" x2="3.01" y2="18" />
            </svg>
          </button>
        </div>
      </header>

      <div class="grid" id="grid"></div>

      <div class="empty-state" id="empty-state" style="display: none">
        <div class="empty-glyph">{ }</div>
        <p>No snippets found</p>
        <span>Try a different search or add a new snippet</span>
      </div>
    </main>

    <!-- MODAL -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal" id="modal">
        <div class="modal-header">
          <h2 class="modal-title">New snippet</h2>
          <button class="modal-close" id="modal-close">✕</button>
        </div>

        <div class="modal-body">
          <div class="field-row two-col">
            <div class="field">
              <label class="field-label">Title</label>
              <input
                class="field-input"
                id="f-title"
                type="text"
                placeholder="e.g. Debounce function"
              />
            </div>
            <div class="field">
              <label class="field-label">Language</label>
              <select class="field-input field-select" id="f-lang">
                <option value="typescript">TypeScript</option>
                <option value="javascript">JavaScript</option>
                <option value="css">CSS</option>
                <option value="html">HTML</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label class="field-label"
              >Description <span class="optional">optional</span></label
            >
            <input
              class="field-input"
              id="f-desc"
              type="text"
              placeholder="What does this snippet do?"
            />
          </div>

          <div class="field">
            <label class="field-label">Code</label>
            <textarea
              class="field-input field-code"
              id="f-code"
              rows="8"
              placeholder="// Paste your code here..."
            ></textarea>
          </div>

          <div class="field">
            <label class="field-label"
              >Tags <span class="optional">comma separated</span></label
            >
            <input
              class="field-input"
              id="f-tags"
              type="text"
              placeholder="e.g. utils, async, array"
            />
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn-cancel" id="btn-cancel">Cancel</button>
          <button class="btn-save" id="btn-save">Save snippet →</button>
        </div>
      </div>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="toast" id="toast">Copied to clipboard</div>

    <!-- JS ще идва тук когато направим src/app.ts -->
    <script src="dist/app.js" type="module"></script>
  </body>
</html>
